<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>瓷砖裂痕检测复核工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f4;color:#172d3c;font:15px "Microsoft YaHei",sans-serif}header{background:#172d3c;color:white;padding:24px 32px;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0 0 8px}header p{margin:0;color:#b8cad3;font-size:13px}.tag{border:1px solid #daa34a;background:#584923;color:#fff0c8;padding:9px 14px;border-radius:20px}.notice{padding:13px 32px;background:#fff3d8;font-size:13px}.layout{display:grid;grid-template-columns:minmax(500px,1fr) 350px;gap:22px;padding:24px 32px}.card{background:white;border:1px solid #dbe3e8;border-radius:12px;overflow:hidden}.toolbar{padding:15px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,a.button,select{border:1px solid #ccd8df;border-radius:6px;padding:9px 12px;background:white;color:#203b4c;cursor:pointer;text-decoration:none;font:inherit;font-size:13px}button.primary{background:#176e6b;color:white;border-color:#176e6b}button:disabled{opacity:.5;cursor:default}.screen{background:#101a22;min-height:340px;display:flex;align-items:center}canvas{width:100%;height:auto;display:block}.status{padding:15px;display:flex;justify-content:space-between;gap:15px;font-size:13px}.subtle{color:#637986;font-size:13px}.metric{display:flex;gap:35px;padding:20px 24px;border-top:1px solid #e5eaed}.metric b{display:block;font-size:23px;color:#176e6b}.list{height:445px;overflow:auto;border-top:1px solid #e0e6ea}.row{padding:14px 17px;border-bottom:1px solid #edf0f2;cursor:pointer;display:flex;justify-content:space-between}.row.active{background:#e7f3f1;border-left:3px solid #176e6b}.badge{font-size:12px;color:#ad3030}.review{padding:18px}textarea{width:100%;height:67px;border:1px solid #cbd8de;border-radius:5px;padding:9px;font:inherit;margin:12px 0}.foot{padding:0 32px 24px;color:#637986;font-size:12px}.error{color:#b32929;padding:10px}a{color:#176e6b}.heading{padding:19px;font-weight:bold;font-size:17px}@media(max-width:1000px){.layout{grid-template-columns:1fr;padding:15px}.list{height:230px}}
</style>
<header><div><h1>瓷砖裂痕检测复核工作台</h1><p>PYNQ-Z2 · Tile V1.1 · FPGA 算法开发与人工复核</p></div><span class="tag">离线参考演示</span></header>
<div class="notice">当前没有开发板图像连接。以下检测结果由离线参考模型预先生成，所有样本为合成素材；不代表板上测试或真实瓷砖准确率。</div>
<div class="layout"><main><div class="card"><div class="toolbar"><button class="primary" id="play">开始离线演示</button><button id="next">下一张</button><label><input type="checkbox" id="boxes" checked>显示候选红框</label><a class="button" href="/player" target="_blank">HDMI 输入播放器</a><button id="original">放大原图</button></div><div class="screen"><canvas id="view" width="1280" height="720"></canvas></div><div class="status"><b id="sample">载入样本…</b><span id="decision"></span></div><div class="metric"><div><b id="number">0</b><span class="subtle">已保存的离线候选帧</span></div><div><b id="pixels">—</b><span class="subtle">候选像素数</span></div><div><b>待接入</b><span class="subtle">板上图像传输</span></div></div></div><p class="subtle">演示会自动保存触发候选报警的样本，同一样本不会重复建档。原图与坐标一同保留；电脑界面不运行裂痕识别。</p><div id="error" class="error"></div></main>
<aside class="card"><div class="heading">缺陷记录与人工审核</div><div class="toolbar"><select id="filter"><option value="all">全部记录</option><option value="pending">待审核</option><option value="confirmed_crack">确认裂痕</option><option value="false_alarm">误报</option></select><a href="/api/export" target="_blank">导出记录 JSON</a></div><div id="records" class="list"></div><div class="review"><b id="reviewTitle">选择一条记录</b><textarea id="note" placeholder="审核备注，例如反光造成误报"></textarea><div class="toolbar" style="padding:0"><button data-review="confirmed_crack">确认裂痕</button><button data-review="false_alarm">标记误报</button><button data-review="pending">待审核</button></div></div></aside></div>
<div class="foot">工程边界：当前为单个总包围框；多裂痕分组、运动同帧叠加、DDR 抓帧和网络回传仍在后续开发范围。</div>
<script>
let state,idx=-1,current=null,selected=null,timer=null,renderToken=0;const $=id=>document.getElementById(id),names={pending:'待审核',confirmed_crack:'确认裂痕',false_alarm:'误报'};
async function api(url,data){let r=await fetch(url,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});let j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}
function fail(e){$('error').textContent=e.message}
function list(){let filter=$('filter').value;$('records').replaceChildren();$('number').textContent=state.reviews.length;state.reviews.filter(r=>filter==='all'||r.review===filter).slice().reverse().forEach(r=>{let el=document.createElement('div');el.className='row'+(r.id===selected?' active':'');let a=document.createElement('span'),b=document.createElement('span');a.textContent=r.id;b.textContent=names[r.review];b.className='badge';el.append(a,b);el.onclick=()=>{selected=r.id;$('note').value=r.note;$('reviewTitle').textContent=r.id+' · 离线参考';show(state.items.find(i=>i.id===r.id));list()};$('records').append(el)})}
function show(row){current=row;let token=++renderToken;let im=new Image();im.onload=()=>{if(token!==renderToken)return;let c=$('view').getContext('2d');c.drawImage(im,0,0,1280,720);if($('boxes').checked){c.strokeStyle='#ff2525';c.lineWidth=3;row.boxes.forEach(([x0,y0,x1,y1])=>c.strokeRect(x0,y0,x1-x0+1,y1-y0+1))}};im.src='/image?id='+encodeURIComponent(row.id);$('sample').textContent=row.id+' · 合成输入';$('decision').textContent=row.alarm?'疑似缺陷 · 需要人工复核':'未触发候选报警';$('decision').style.color=row.alarm?'#bb3232':'#176e6b';$('pixels').textContent=row.candidate_pixels}
async function next(){idx=(idx+1)%state.items.length;let row=state.items[idx];show(row);if(row.alarm){await api('/api/capture',{id:row.id});state=await api('/api/state');list()}}
$('next').onclick=()=>next().catch(fail);$('boxes').onchange=()=>current&&show(current);$('filter').onchange=list;
$('original').onclick=()=>current&&window.open('/image?id='+current.id,'_blank');
$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='继续离线演示'}else{next().catch(fail);timer=setInterval(()=>next().catch(fail),1200);$('play').textContent='暂停演示'}};
document.querySelectorAll('[data-review]').forEach(b=>b.onclick=async()=>{if(!selected)return;try{await api('/api/review',{id:selected,review:b.dataset.review,note:$('note').value});state=await api('/api/state');list()}catch(e){fail(e)}});
(async()=>{state=await api('/api/state');list();show(state.items[0])})().catch(fail);
</script></html>
