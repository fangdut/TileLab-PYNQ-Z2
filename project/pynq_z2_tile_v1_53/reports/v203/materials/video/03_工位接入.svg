<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#101b2a"/><g fill="#eef4fb" font-family="Microsoft YaHei, sans-serif"><text x="120" y="130" font-size="54" font-weight="700">从已验证模块到实际复检工位</text><text x="120" y="220" font-size="36" fill="#6cdbca">已实现　计算与记录</text><text x="150" y="282" font-size="29">照片输入 → PL筛查 → 人员复核接口 → 逻辑处置 → 留档</text><text x="120" y="410" font-size="36" fill="#6cdbca">待接入　固定成像与反馈</text><text x="150" y="472" font-size="29">固定相机与光源 · 工件定位和静止反馈 · 执行器到位反馈</text><text x="120" y="600" font-size="36" fill="#6cdbca">待验收　实际应用效果</text><text x="150" y="662" font-size="29">独立花色和批次 · 光照位置变化 · 人工耗时 · 长期稳定性</text><text x="120" y="790" font-size="36" fill="#6cdbca">当前价值</text><text x="150" y="852" font-size="29">异常区域提示和统一证据记录；尚未量化省人、省电和产能收益</text><text x="120" y="1020" font-size="25" fill="#bbc8d6">TileLab 单片瓷砖停驻检测原型　指标范围以实测记录为准</text></g></svg>