<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#101b2a"/><g fill="#eef4fb" font-family="Microsoft YaHei, sans-serif"><text x="120" y="130" font-size="54" font-weight="700">相同冻结配置的上板证据</text><text x="120" y="220" font-size="36" fill="#6cdbca">124.72 ms 内核均时　501.79 ms 传图加检测均时</text><text x="150" y="282" font-size="29">117张公开开发图片；分数和掩膜逐值一致，帧序号除外</text><text x="120" y="410" font-size="36" fill="#6cdbca">100个完整逻辑周期通过</text><text x="150" y="472" font-size="29">均时1.220秒，含0.25秒脚本复核等待；非真实人工或机械产能</text><text x="120" y="600" font-size="36" fill="#6cdbca">100MHz　218/220 DSP　127.5/140 BRAM等效块</text><text x="150" y="662" font-size="29">容量与时序来自实现报告；资源紧张不等于效率领先</text><text x="120" y="790" font-size="36" fill="#6cdbca">适用范围</text><text x="150" y="852" font-size="29">约310秒有限测试 · 无独立未知批次准确率或全天长稳结论</text><text x="120" y="1020" font-size="25" fill="#bbc8d6">TileLab 单片瓷砖停驻检测原型　指标范围以实测记录为准</text></g></svg>